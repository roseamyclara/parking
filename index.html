<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="text-scale" content="scale">
<meta name="color-scheme" content="light dark">
<script>
  // 只做一件事：在第一次繪製前套用使用者選的外觀，避免閃爍。
  try { document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") || "light dark"; } catch (e) {}
</script>
<meta name="theme-color" content="#0d5a8a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121a22" media="(prefers-color-scheme: dark)">
<title>臺中市身障免銷單停車場地圖</title>
<meta name="description" content="臺中市身心障礙者免銷單服務已上線停車場，可依名稱、地點、進出場方式搜尋，並顯示離您最近的停車場。資料每日自動更新。">
<link rel="preconnect" href="https://maps.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<a class="skip" href="#list">跳到停車場清單</a>

<div class="app">
  <header class="top">
    <h1><span class="logo" aria-hidden="true">♿</span>臺中市身障免銷單停車場地圖</h1>
    <p class="meta">
      <span id="metaCount">載入中…</span>
      <span aria-hidden="true">·</span>
      <a href="https://tcparking.taichung.gov.tw/ParkWeb/Pages/PublicService/LoveCardSchedule" target="_blank" rel="noopener">資料來源：臺中市停車資訊網</a>
    </p>
  </header>

  <div class="controls">
    <form class="searchrow" role="search" id="searchForm" action="#">
      <div class="searchbox">
        <label class="visually-hidden" for="q">搜尋停車場名稱、路名、行政區，或輸入地點</label>
        <svg class="ico" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" autocomplete="off" enterkeyhint="search"
               placeholder="停車場名稱、路名，或地點（例：臺中車站）">
        <button class="clear" id="clearQ" type="button" aria-label="清除搜尋" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <button class="btn primary" id="btnNear" type="button"><span aria-hidden="true">📍</span> <span class="lbl">離我最近</span></button>
    </form>

    <div class="placehint" id="placeHint" hidden>
      <span id="placeHintText"></span>
      <button type="button" class="btn small" id="placeSearchBtn">搜尋這個地點附近的停車場</button>
    </div>

    <div class="originbar" id="originBar" hidden>
      <span><span aria-hidden="true">📍</span> 以 <strong id="originName"></strong> 為中心，依距離排序</span>
      <button type="button" class="linkbtn" id="clearOrigin">取消<span class="visually-hidden">地點排序</span></button>
    </div>

    <div class="filterrow">
      <div class="field">
        <label for="fDistrict">行政區</label>
        <select id="fDistrict"><option value="">全部</option></select>
      </div>
      <div class="field">
        <label for="fSort">排序</label>
        <select id="fSort">
          <option value="default">預設（公告順序）</option>
          <option value="distance">距離由近到遠</option>
          <option value="name">名稱</option>
        </select>
      </div>
      <details class="accessfilter" id="accessFilter">
        <summary>進出場方式<span class="count" id="accessCount"></span></summary>
        <div class="chips" id="accessChips" role="group" aria-label="依進出場方式篩選（可複選）"></div>
      </details>
    </div>
  </div>

  <div class="tabbar" id="tabbar" aria-label="切換清單或地圖">
    <button class="tab" id="tabList" type="button" aria-controls="listpane"><span aria-hidden="true">📋</span> 清單</button>
    <button class="tab" id="tabMap" type="button" aria-controls="mappane"><span aria-hidden="true">🗺️</span> 地圖</button>
  </div>

  <main id="main">
    <section class="listpane" id="listpane" aria-labelledby="listTitle">
      <div class="listhead">
        <h2 id="listTitle" class="visually-hidden">停車場清單</h2>
        <span id="resultCount" aria-live="polite">—</span>
        <span id="geoNote"></span>
      </div>
      <ul id="list" tabindex="-1"></ul>
    </section>
    <section class="mappane" id="mappane" aria-label="地圖">
      <div id="map"></div>
      <div class="mapmsg" id="mapMsg" hidden></div>
    </section>
  </main>

  <footer class="foot">
    <span id="footMeta">資料每日自動更新。</span>
    <details class="about">
      <summary>關於本站與免責</summary>
      <div class="aboutbody">
        <p id="footDates"></p>
        <p>資料來源：<a href="https://tcparking.taichung.gov.tw/ParkWeb/Pages/PublicService/LoveCardSchedule" target="_blank" rel="noopener">臺中市停車資訊網 — 身障免銷單服務已上線停車場</a>。地圖：Google 地圖。</p>
        <p>座標由地理編碼推估，實際位置請以現場標示為準；免銷單服務內容與適用對象，一律以臺中市政府交通局公告為準。
        <strong>本站為民間製作的資料整理工具，非官方網站。</strong></p>
        <div class="field">
          <label for="themeSel">外觀</label>
          <select id="themeSel">
            <option value="light dark" id="themeSystemOpt">跟隨系統</option>
            <option value="light">淺色</option>
            <option value="dark">深色</option>
          </select>
        </div>
      </div>
    </details>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="./config.js"></script>
<script src="./app.js" type="module"></script>
</body>
</html>
