name: 更新 TDX 剩餘車位

on:
  schedule:
    # 每 5 分鐘（GitHub 的排程是盡力而為，尖峰時可能延遲或略過）
    - cron: "*/5 * * * *"
  workflow_dispatch:        # 允許手動觸發

permissions:
  contents: write

# 與每日的 update-parking 分開排隊；不中途取消，免得 push 做到一半被砍
concurrency:
  group: tdx
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 離線測試
        run: node --test scripts/test_tdx_availability.mjs

      - name: 抓 TDX 剩餘車位並配對
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        # 失敗時程式以非 0 結束，不會覆蓋原本的 availability.json
        run: node scripts/tdx_availability.mjs

      - name: 有變動才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/availability.json
          if git diff --staged --quiet; then
            echo "剩餘車位無變動，略過 commit"
            exit 0
          fi
          git commit -m "chore(parking): 更新 TDX 剩餘車位 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          # 每日停車場資料更新可能同時 push，先 rebase 再推，失敗時重試幾次
          for i in 1 2 3; do
            # 衝突時以這次抓到的最新車位資料為準（rebase 中 theirs = 正在重放的本次 commit）
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push 失敗，第 $i 次重試"
            sleep $((i * 5))
          done
          exit 1
